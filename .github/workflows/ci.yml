name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Escaneo de secretos (Gitleaks Open Source - Sin restricción de licencia)
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Escaneo de secretos con Gitleaks
        run: gitleaks detect --verbose --redact

  # 2. Linter y Pruebas técnicas de Flutter
  test:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ejecutar análisis y pruebas
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
            flutter analyze
            flutter test
          else
            echo "Aviso: pubspec.yaml aún no existe. Se activará automáticamente cuando inicialices la app Flutter."
          fi
